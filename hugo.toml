baseURL = "https://pi-go.sh/"
languageCode = "en-us"
title = "pi-go"
description = "A terminal AI coding agent built on Google ADK Go."

# The blog lives under /blog/. RSS at /blog/feed.xml and also
# aliased to /feed.xml for existing subscribers.
[permalinks]
  blog = "/blog/:slugorfilename/"

[[menu.main]]
  name = "Features"
  url = "/#features"
  weight = 1

[[menu.main]]
  name = "Install"
  url = "/#install"
  weight = 2

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 3

[[menu.main]]
  name = "GitHub"
  url = "https://github.com/dimetron/pi-go"
  weight = 4

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "monokai"
  lineNos = false

[outputFormats]
  [outputFormats.rss]
    mediatype = "application/rss+xml"
    baseName = "feed"

[outputs]
  home = ["rss"]
  section = ["html", "rss"]
  page = ["html"]

# `docs/` lives at the repo root (the .tape rebuild scripts write there), but
# Hugo only publishes `static/`. Mount it so the landing page's images ship.
# Declaring static mounts replaces the default for that component only, so the
# normal `static` mount is re-declared here alongside it.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "docs"
    target = "static/docs"
