{{ define "main" }}
  <main>
    <div class="blog-header">
      <h1>Blog</h1>
      <p>Updates, ideas, and release notes from the pi-go project.</p>
      <a class="rss-link" href="{{ "/blog/feed.xml" | relURL }}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6.18 15.64a2.18 2.18 0 1 1 0 4.36 2.18 2.18 0 0 1 0-4.36ZM4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44Zm0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93V10.1Z"/>
        </svg>
        Subscribe via RSS
      </a>
    </div>

    <div class="posts">
      {{ range .Pages }}
      <a class="post-card" href="{{ .RelPermalink }}">
        <div class="post-meta">
          <span class="dot"></span>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02, 2006" }}</time>
          <span>·</span>
          <span>{{ .Params.category | default "Post" }}</span>
        </div>
        <h2>{{ .Title }}</h2>
        <p>{{ .Description | default .Summary }}</p>
        <span class="read-more">Read post &rarr;</span>
      </a>
      {{ end }}
    </div>
  </main>
{{ end }}
